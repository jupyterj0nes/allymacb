<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="allymacb: a comic clock that objects, with an exclamation mark for a hand; a STOMPED stamp slams on a fake timestamp">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#FF8FA3"/>
    </pattern>
  </defs>
  <rect width="900" height="300" rx="28" fill="#FF5C7A"/>
  <rect width="900" height="300" rx="28" fill="url(#dots)" opacity="0.55"/>

  <g transform="translate(14 14) scale(0.907)">
  <!-- burst -->
  <path transform="translate(150 150) rotate(-6)" d="M0 -132 L24 -88 L72 -112 L66 -62 L120 -58 L82 -24 L124 12 L74 24 L92 74 L42 60 L22 112 L0 70 L-22 112 L-42 60 L-92 74 L-74 24 L-124 12 L-82 -24 L-120 -58 L-66 -62 L-72 -112 L-24 -88 Z" fill="#FFE14D" stroke="#1F1B2E" stroke-width="8" stroke-linejoin="round"/>

  <!-- the clock -->
  <g transform="translate(150 150)">
    <circle r="76" fill="#1F1B2E" transform="translate(6 6)"/>
    <circle r="76" fill="#FFFFFF" stroke="#1F1B2E" stroke-width="8"/>
    <g stroke="#1F1B2E" stroke-width="5" stroke-linecap="round">
      <line x1="38" y1="-38" x2="45" y2="-45"/><line x1="38" y1="38" x2="45" y2="45"/>
      <line x1="-38" y1="38" x2="-45" y2="45"/><line x1="-38" y1="-38" x2="-45" y2="-45"/>
    </g>
    <g font-family="'Arial Black', 'Segoe UI Black', sans-serif" font-weight="900" font-size="26" text-anchor="middle">
      <text x="0" y="-44" fill="#2FB86A">M</text>
      <text x="52" y="9" fill="#3D7BFF">A</text>
      <text x="0" y="64" fill="#F29D00">C</text>
      <text x="-52" y="9" fill="#FF3D5E">B</text>
    </g>
    <!-- the hand is an exclamation mark -->
    <g transform="rotate(14)">
      <path d="M-9 -40 L9 -40 L5 4 L-5 4 Z" fill="#FF3D5E" stroke="#1F1B2E" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="0" cy="22" r="9" fill="#FF3D5E" stroke="#1F1B2E" stroke-width="5"/>
    </g>
  </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Arial Black', 'Segoe UI Black', sans-serif" font-weight="900">
    <text x="320" y="132" font-size="96" fill="#1F1B2E" letter-spacing="-3">allymacb</text>
    <text x="316" y="128" font-size="96" fill="#FFFFFF" letter-spacing="-3">allymacb</text>
  </g>

  <!-- the fake timestamp, and the stamp slamming on it -->
  <g transform="translate(320 156)">
    <rect width="262" height="42" rx="10" fill="#FFFFFF" stroke="#1F1B2E" stroke-width="5"/>
    <text x="131" y="28" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#1F1B2E">2001-01-01 00:00:00</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -40; 0 -40; 0 0; 0 0" keyTimes="0;0.5;0.56;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.54;1" dur="2.6s" repeatCount="indefinite"/>
    <g transform="rotate(-9 452 177)">
      <rect x="378" y="152" width="148" height="48" rx="6" fill="#FFFFFF" fill-opacity="0.15" stroke="#E0002E" stroke-width="5"/>
      <text x="452" y="186" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', sans-serif" font-size="26" font-weight="900" fill="#E0002E">STOMPED</text>
    </g>
  </g>

  <rect x="320" y="222" width="452" height="42" rx="21" fill="#1F1B2E"/>
  <text x="546" y="250" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFE14D">the filesystem timeline that objects</text>
</svg>
